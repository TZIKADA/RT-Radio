name: Slave Header Release

on:
  push:
    branches: [main]
    paths: ["hardware/slaves/**"]

permissions:
  contents: write

concurrency:
  group: slave-header-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create a release for each changed slave folder
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # Which slave folders changed in this push?
          base="$BEFORE"
          if [[ "$base" =~ ^0+$ ]]; then
            base="$(git hash-object -t tree /dev/null)"   # new branch: diff against empty tree
          fi
          folders="$(git diff --name-only "$base" "$GITHUB_SHA" -- hardware/slaves \
            | awk -F/ 'NF >= 4 {print $3}' | sort -u)"

          for folder in $folders; do
            [[ "$folder" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "::error::Bad folder name '$folder'"; exit 1; }
            [[ -d "hardware/slaves/$folder" ]] || { echo "$folder was deleted; nothing to release."; continue; }

            # Already released at this commit? (makes re-runs safe)
            if [[ -n "$(git tag --points-at "$GITHUB_SHA" --list "$folder-v*")" ]]; then
              echo "$folder already released at $GITHUB_SHA; skipping."
              continue
            fi

            # Next version = latest folder-vX.Y.Z tag with patch + 1
            latest="$(git tag --list "$folder-v*" --sort=-v:refname \
              | grep -E "^$folder-v[0-9]+\.[0-9]+\.[0-9]+$" | head -n1 || true)"
            if [[ -z "$latest" ]]; then
              new="0.0.1"
            else
              IFS=. read -r major minor patch <<< "${latest#"$folder-v"}"
              new="$major.$minor.$((patch + 1))"
            fi
            tag="$folder-v$new"

            # Assets: every .h file, flattened (sub/dir/a.h -> sub__dir__a.h)
            assets_dir="$(mktemp -d)"
            assets=()
            while IFS= read -r -d '' file; do
              name="${file#hardware/slaves/$folder/}"
              name="${name//\//__}"
              cp "$file" "$assets_dir/$name"
              assets+=("$assets_dir/$name")
            done < <(find "hardware/slaves/$folder" -name '*.h' -print0)

            # Release notes = the folder's README
            readme="hardware/slaves/$folder/README.md"
            if [[ -f "$readme" ]]; then
              notes=(--notes-file "$readme")
            else
              notes=(--notes "No README.md was present in this folder at release time.")
            fi

            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" --title "$folder" "${notes[@]}"
            echo "Released $tag."
          done
