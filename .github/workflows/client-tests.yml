name: Client CI

on:
  push:
    branches: [main, client]
    paths:
      - "client/**"
      - ".github/workflows/client-tests.yml"
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client-tests.yml"
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR
concurrency:
  group: client-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: client

    # Tests mock Supabase, so no real credentials are needed. These dummy values just keep any module that reads the env vars from throwing.
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-dummy-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Type-check and build
        run: npm run build
