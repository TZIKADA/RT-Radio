name: Sync Slave Headers to Supabase

on:
  workflow_run:
    workflows: ["Slave Header Release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slave-header-supabase-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync latest slave releases to Supabase
    # Don't sync after a failed release run.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sync latest releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_SECRET_KEY" ]]; then
            echo "::error::Configure SUPABASE_URL and SUPABASE_SECRET_KEY as repository Actions secrets."
            exit 1
          fi
          if [[ "$SUPABASE_SECRET_KEY" != sb_secret_* ]]; then
            echo "::error::SUPABASE_SECRET_KEY must be a Supabase secret API key, not a legacy JWT."
            exit 1
          fi

          # Prints the response body on success; on failure prints the status
          # code and body so the real error is visible in the Actions log.
          # Only GETs are retried: retrying a write could apply it twice.
          supa() { # usage: supa METHOD URL [curl args...]
            local method="$1" url="$2"; shift 2
            local out status extra=()
            if [[ "$method" == "GET" ]]; then
              extra=(-H "Accept-Profile: api" --retry 3 --retry-all-errors)
            else
              extra=(-H "Content-Profile: api")
            fi
            out="$(mktemp)"
            status="$(curl --silent --show-error --max-time 30 --request "$method" "$url" \
              -H "apikey: $SUPABASE_SECRET_KEY" \
              "${extra[@]}" \
              "$@" \
              -o "$out" -w '%{http_code}')"
            if [ "$status" -ge 400 ]; then
              echo "::error::Supabase $method $url returned HTTP $status: $(cat "$out")" >&2
              rm -f "$out"
              exit 1
            fi
            cat "$out"
            rm -f "$out"
          }

          # Keep one database row per folder, pointing at its highest version.
          # (Highest semver, not newest publish time: publish times can tie or
          # be out of order after a backfill.)
          RELEASE_APIS="$(
            gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
              | jq -s --arg repo "$GH_REPO" '
                  [
                    .[][]?
                    | select(.draft == false and (.published_at | type == "string"))
                    | .tag_name as $tag
                    | select($tag | test("^[A-Za-z0-9_-]+-v[0-9]+\\.[0-9]+\\.[0-9]+$"))
                    | ($tag | capture("^(?<folder>[A-Za-z0-9_-]+)-v(?<v>[0-9]+\\.[0-9]+\\.[0-9]+)$")) as $m
                    | {
                        folder: $m.folder,
                        version: ($m.v | split(".") | map(tonumber)),
                        github_api: "https://api.github.com/repos/\($repo)/releases/tags/\($tag)"
                      }
                  ]
                  | sort_by(.version)
                  | group_by(.folder)
                  | map(last)
                '
          )"

          # Safety net: an empty list would make the plan below delete every row.
          if [[ "$(jq 'length' <<< "$RELEASE_APIS")" -eq 0 ]]; then
            echo "::error::No published slave releases found; refusing to modify the headers table."
            exit 1
          fi

          API_PREFIX="https://api.github.com/repos/$GH_REPO/releases/tags/"
          REST_HEADERS_URL="${SUPABASE_URL%/}/rest/v1/headers"
          EXISTING_ROWS='[]'
          OFFSET=0
          PAGE_SIZE=1000

          while true; do
            PAGE="$(supa GET "$REST_HEADERS_URL" --get \
              --data-urlencode "select=id,github_api" \
              --data-urlencode "github_api=like.${API_PREFIX}*" \
              --data-urlencode "order=id.asc" \
              --data-urlencode "limit=$PAGE_SIZE" \
              --data-urlencode "offset=$OFFSET")"
            PAGE_COUNT="$(jq 'length' <<< "$PAGE")"
            EXISTING_ROWS="$(jq -cn \
              --argjson existing "$EXISTING_ROWS" \
              --argjson page "$PAGE" \
              '$existing + $page')"
            if (( PAGE_COUNT < PAGE_SIZE )); then
              break
            fi
            OFFSET=$((OFFSET + PAGE_SIZE))
          done

          if ! jq -e 'all(.[]; (.id | type == "string" or type == "number") and (.github_api | type == "string"))' \
               <<< "$EXISTING_ROWS" >/dev/null; then
            echo "::error::Unexpected row shape in headers table (id or github_api has the wrong type)."
            exit 1
          fi

          # Rows are updated in place (not deleted and re-inserted) so their ids
          # stay stable for anything that references them.
          SYNC_PLAN="$(jq -cn \
            --argjson rows "$EXISTING_ROWS" \
            --argjson desired "$RELEASE_APIS" '
              def folder:
                try (
                  .github_api
                  | capture("/releases/tags/(?<folder>[A-Za-z0-9_-]+)-v[0-9]+\\.[0-9]+\\.[0-9]+$").folder
                ) catch null;

              [
                $desired[] as $target
                | ([$rows[] | select(folder == $target.folder)] | sort_by(.id)) as $matches
                | if ($matches | length) == 0 then
                    {action: "insert", github_api: $target.github_api}
                  else
                    (
                      {
                        action: (if $matches[0].github_api == $target.github_api then "keep" else "update" end),
                        id: $matches[0].id,
                        github_api: $target.github_api
                      },
                      ($matches[1:][] | {action: "delete", id: .id})
                    )
                  end
              ]
              +
              [
                $rows[] as $row
                | ($row | folder) as $row_folder
                | select($row_folder != null)
                | select(([$desired[].folder] | index($row_folder)) == null)
                | {action: "delete", id: $row.id}
              ]
            ')"

          NEW_ROWS="$(jq -c '[.[] | select(.action == "insert") | {github_api}]' <<< "$SYNC_PLAN")"
          if [[ "$(jq 'length' <<< "$NEW_ROWS")" -gt 0 ]]; then
            supa POST "$REST_HEADERS_URL" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=minimal" \
              --data "$NEW_ROWS" >/dev/null
          fi

          mapfile -t UPDATES < <(jq -r \
            '.[] | select(.action == "update") | [.id, .github_api] | @tsv' \
            <<< "$SYNC_PLAN")
          for update in "${UPDATES[@]}"; do
            IFS=$'\t' read -r id github_api <<< "$update"
            if [[ ! "$id" =~ ^[A-Za-z0-9_-]+$ ]]; then
              echo "::error::Unexpected id format in headers table."
              exit 1
            fi
            payload="$(jq -cn --arg github_api "$github_api" '{github_api: $github_api}')"
            supa PATCH "$REST_HEADERS_URL?id=eq.$id" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=minimal" \
              --data "$payload" >/dev/null
          done

          mapfile -t STALE_IDS < <(jq -r \
            '.[] | select(.action == "delete") | .id' <<< "$SYNC_PLAN")
          for ((i = 0; i < ${#STALE_IDS[@]}; i += 100)); do
            batch=("${STALE_IDS[@]:i:100}")
            for id in "${batch[@]}"; do
              if [[ ! "$id" =~ ^[A-Za-z0-9_-]+$ ]]; then
                echo "::error::Unexpected id format in headers table."
                exit 1
              fi
            done
            id_csv="$(IFS=,; printf '%s' "${batch[*]}")"
            supa DELETE "$REST_HEADERS_URL?id=in.($id_csv)" \
              -H "Prefer: return=minimal" >/dev/null
          done

          echo "Supabase headers synced: $(jq 'length' <<< "$RELEASE_APIS") folders, ${#STALE_IDS[@]} stale rows removed."
